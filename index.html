<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#102a1e">
<title>Oval Arcade V12 — True 3D</title>
<style>
*{box-sizing:border-box;touch-action:none;-webkit-user-select:none;user-select:none}html,body{margin:0;width:100%;height:100%;height:100dvh;overflow:hidden;background:#10241c;font-family:system-ui,sans-serif;color:white}canvas{display:block}
#hud{position:fixed;top:max(6px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:4;background:#0c2035dd;border:1px solid #ffffff44;border-radius:12px;padding:7px 13px;white-space:nowrap;font-size:clamp(11px,2.1vw,15px);font-weight:800;pointer-events:none}
#version{position:fixed;z-index:9;top:max(7px,env(safe-area-inset-top));right:max(9px,env(safe-area-inset-right));padding:6px 10px;border-radius:7px;background:#ffd45a;color:#17242b;font-size:12px;font-weight:900;box-shadow:0 2px 9px #0007;pointer-events:none}
#menu{position:fixed;top:max(8px,env(safe-area-inset-top));left:max(9px,env(safe-area-inset-left));z-index:5;display:flex;gap:5px}
button{border:0;font-weight:800;color:#14222b;border-radius:10px;background:#ffd45a;padding:8px 10px;font-size:12px;touch-action:none}
#joy{position:fixed;bottom:max(14px,env(safe-area-inset-bottom));left:max(20px,env(safe-area-inset-left));height:112px;width:112px;border-radius:50%;border:3px solid #ffffff8c;background:#092e30a0;z-index:5;touch-action:none}
#nub{position:absolute;width:47px;height:47px;left:30px;top:30px;border-radius:50%;background:#fbd15b;box-shadow:0 2px 12px #0009;pointer-events:none}
#actions{position:fixed;bottom:max(12px,env(safe-area-inset-bottom));right:max(16px,env(safe-area-inset-right));z-index:5;display:grid;grid-template-columns:repeat(2,76px);gap:8px}
#actions button{height:49px;border:2px solid #ffffff88;box-shadow:0 2px 8px #0007}#pass{background:#8cd6ff}#tackle{background:#ffa48c}#switch{background:#eee}
#power{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:calc(max(12px,env(safe-area-inset-bottom)) + 116px);z-index:5;width:160px;height:13px;border:1px solid #fff8;border-radius:7px;background:#102a2ddd;overflow:hidden}
#fill{height:100%;width:0%;background:linear-gradient(90deg,#75d778,#ffd359,#ff6150)}
#hint{position:fixed;left:50%;top:52px;transform:translateX(-50%);z-index:5;font-size:12px;background:#0a2d37a8;padding:4px 9px;border-radius:7px;white-space:nowrap;pointer-events:none}
#rotate{display:none;position:fixed;inset:0;background:#0d2833;z-index:20;align-items:center;justify-content:center;text-align:center;padding:30px;font-size:22px;font-weight:800}
#loading{position:fixed;inset:0;background:#102a1e;z-index:19;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
@media(orientation:portrait){#rotate{display:flex}}
@media(max-height:350px){#joy{width:88px;height:88px}#nub{width:38px;height:38px;left:22px;top:22px}#actions button{height:40px}#power{bottom:105px}}
</style></head><body>
<div id="loading">Loading Oval Arcade V12 3D…<br><small>Internet connection required for Three.js</small></div>
<div id="rotate">↻<br>Rotate your iPhone to landscape</div>
<div id="hud">BLUE <span id="blueScore">0</span> — <span id="clock">2:00</span> — RED <span id="redScore">0</span></div>
<div id="version">V12 • 3D</div>
<div id="menu"><button id="start">START</button><button id="camera">CAMERA</button></div>
<div id="hint">Move with left thumb • Hold KICK for power</div>
<div id="joy"><div id="nub"></div></div>
<div id="power"><div id="fill"></div></div>
<div id="actions"><button id="kick">KICK</button><button id="pass">PASS</button><button id="tackle">TACKLE</button><button id="switch">SWITCH</button></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.min.js"></script>
<script>
(()=>{'use strict';
const loading=document.getElementById('loading');
if(!window.THREE){loading.innerHTML='Could not load Three.js.<br>Check your internet connection and reload.';return}
const T=THREE, scene=new T.Scene();scene.background=new T.Color(0x7ba5c6);scene.fog=new T.Fog(0x7ba5c6,165,300);
const renderer=new T.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.6));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;
renderer.outputColorSpace=T.SRGBColorSpace;document.body.prepend(renderer.domElement);
const camera=new T.PerspectiveCamera(49,innerWidth/innerHeight,.1,400);
scene.add(new T.HemisphereLight(0xe8f5ff,0x46683e,2.2));
const sun=new T.DirectionalLight(0xfff1d0,2.6);sun.position.set(-45,90,65);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-115;sun.shadow.camera.right=115;sun.shadow.camera.top=90;sun.shadow.camera.bottom=-90;scene.add(sun);
const mat=(c,rough=.85)=>new T.MeshStandardMaterial({color:c,roughness:rough});
const grass=mat(0x30834a), stripe=mat(0x348b4f), lineMat=new T.LineBasicMaterial({color:0xf5f5e5});
function mesh(geo,m,parent=scene){let o=new T.Mesh(geo,m);parent.add(o);return o}
const ground=mesh(new T.PlaneGeometry(420,320),mat(0x315e3c));ground.rotation.x=-Math.PI/2;ground.position.y=-.13;ground.receiveShadow=true;
const L=112,W=64; // half dimensions, rounded-rectangle oval
function boundary(t){const a=101,b=60,n=2.45,co=Math.cos(t),si=Math.sin(t);return new T.Vector3(a*Math.sign(co)*Math.pow(Math.abs(co),2/n),.04,b*Math.sign(si)*Math.pow(Math.abs(si),2/n))}
const outline=[];for(let i=0;i<=180;i++)outline.push(boundary(i*Math.PI*2/180));
const shape=new T.Shape();shape.moveTo(outline[0].x,outline[0].z);for(let i=1;i<outline.length;i++)shape.lineTo(outline[i].x,outline[i].z);
const sg=new T.ShapeGeometry(shape);sg.rotateX(Math.PI/2); // shape y -> world z negative; symmetric
const turf=mesh(sg,grass);turf.position.y=-.04;turf.receiveShadow=true;
function draw(points){const g=new T.BufferGeometry().setFromPoints(points.map(p=>new T.Vector3(p[0],.13,p[1])));scene.add(new T.Line(g,lineMat))}
draw(outline.map(p=>[p.x,p.z]));
function circle(cx,cz,r,from=0,to=Math.PI*2){let p=[];for(let i=0;i<=90;i++){let a=from+(to-from)*i/90;p.push([cx+Math.cos(a)*r,cz+Math.sin(a)*r])}draw(p)}
draw([[-9,-9],[9,-9],[9,9],[-9,9],[-9,-9]]);circle(0,0,8);circle(0,0,2.7);
for(let side of [-1,1]){let x=side*100;draw([[x,-8],[x-side*9,-8],[x-side*9,8],[x,8]]);circle(side*103,0,43,side===1?Math.PI*.59:-Math.PI*.41,side===1?Math.PI*1.41:Math.PI*.41)}
// subtle turf mowing stripes
for(let x=-90;x<=90;x+=20){const s=mesh(new T.PlaneGeometry(10,105),stripe);s.rotation.x=-Math.PI/2;s.position.set(x,-.03,0);s.receiveShadow=true}
// goalposts
for(let side of [-1,1])for(let z of [-12,-4,4,12]){let post=mesh(new T.CylinderGeometry(.32,.32,Math.abs(z)===4?11:7,10),mat(0xffffff));post.position.set(side*100,post.geometry.parameters.height/2,z);post.castShadow=true}
// distant stands (real 3D geometry)
const stand=mat(0x5b6773),crowd=[mat(0xc1a86b),mat(0x374b80),mat(0xe7e3d3),mat(0x982d38)];
for(let side of [-1,1])for(let i=0;i<18;i++){let x=-102+i*12;let p=mesh(new T.BoxGeometry(11,8,10),stand);p.position.set(x,4,side*84);for(let k=0;k<3;k++){let c=mesh(new T.BoxGeometry(9,1,1),crowd[(i+k)%4]);c.position.set(x,4+k*1.6,side*(78-k*.6))}}
const teams=[0x1976d2,0xe53935],skin=mat(0xe6b18b),dark=mat(0x1c2630);
function makePlayer(team,x,z,number){let root=new T.Group();scene.add(root);root.position.set(x,0,z);
let shadow=mesh(new T.CircleGeometry(1.65,16),new T.MeshBasicMaterial({color:0x081d10,transparent:true,opacity:.27}),root);shadow.rotation.x=-Math.PI/2;shadow.position.y=.03;
const torso=mesh(new T.CylinderGeometry(.95,1.05,2.35,10),mat(teams[team]),root);torso.position.y=3.2;torso.castShadow=true;
const head=mesh(new T.SphereGeometry(.69,12,10),skin,root);head.position.y=5.12;head.castShadow=true;
const hair=mesh(new T.SphereGeometry(.69,12,8),dark,root);hair.scale.y=.36;hair.position.y=5.62;
let limbs=[];for(let a of [-1,1]){let arm=mesh(new T.CapsuleGeometry(.26,1.25,4,7),skin,root);arm.position.set(a*1.15,3.1,0);arm.rotation.z=a*.24;limbs.push(arm);let leg=mesh(new T.CapsuleGeometry(.36,1.5,4,7),dark,root);leg.position.set(a*.5,1.18,0);limbs.push(leg)}
const ring=mesh(new T.RingGeometry(1.65,2.05,28),new T.MeshBasicMaterial({color:0xffe15a,side:T.DoubleSide}),root);ring.rotation.x=-Math.PI/2;ring.position.y=.07;ring.visible=false;
return {root,team,x,z,vx:0,vz:0,homeX:x,homeZ:z,faceX:team===0?1:-1,faceZ:0,number,limbs,ring,run:0}}
const players=[];function resetPlayers(){players.forEach(p=>scene.remove(p.root));players.length=0;for(let team=0;team<2;team++)for(let i=0;i<7;i++){let xx=[-55,-34,-32,-10,-8,-68,-48][i]*(team===0?1:-1),zz=[0,-23,23,-16,17,32,-34][i];players.push(makePlayer(team,xx,zz,i))}}
resetPlayers();
const ballObj=mesh(new T.SphereGeometry(.75,16,10),mat(0xb62c2c,.5));ballObj.scale.set(1.5,.72,.8);ballObj.castShadow=true;
const ball={owner:players[0],x:players[0].x,z:players[0].z,y:3,vx:0,vz:0,vy:0,flight:false};
let controlled=players[0],playing=false,remaining=120,blue=0,red=0,joyX=0,joyZ=0,kickHeld=false,charge=0,camMode=0,noticeTimer=0;
const byId=id=>document.getElementById(id),hint=byId('hint');
function say(s){hint.textContent=s;noticeTimer=2.3}
function select(p){controlled.ring.visible=false;controlled=p;controlled.ring.visible=true}select(controlled);
function closest(team,x,z,exclude=null){let best=null,d=Infinity;for(let p of players)if(p.team===team&&p!==exclude){let v=Math.hypot(p.x-x,p.z-z);if(v<d){d=v;best=p}}return best}
function possess(p){ball.owner=p;ball.flight=false;ball.vx=ball.vz=ball.vy=0;if(p.team===0)select(p)}
function kick(power,pass=false){if(!ball.owner||ball.owner!==controlled)return;let p=ball.owner,tx=p.faceX,tz=p.faceZ;const teammate=closest(0,p.x+tx*25,p.z+tz*25,p);if(pass&&teammate){tx=teammate.x-p.x;tz=teammate.z-p.z}let len=Math.hypot(tx,tz)||1;tx/=len;tz/=len;ball.owner=null;ball.flight=true;ball.x=p.x+tx*2;ball.z=p.z+tz*2;ball.y=4.1;let strength=pass?23:23+power*36;ball.vx=tx*strength;ball.vz=tz*strength;ball.vy=pass?9:12+power*21;say(pass?'Handball!':`Kick power ${Math.round(power*100)}%`)}
function score(team,points){if(team===0)blue+=points;else red+=points;byId('blueScore').textContent=blue;byId('redScore').textContent=red;say(points===6?'GOAL!':'BEHIND!');resetPositions()}
function resetPositions(){for(let p of players){p.x=p.homeX;p.z=p.homeZ;p.root.position.set(p.x,0,p.z)}possess(players[0])}
const joy=byId('joy'),nub=byId('nub');let joyPointer=null;
function moveJoy(e){let r=joy.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,mag=Math.hypot(x,y),lim=r.width*.35,scale=Math.min(1,lim/(mag||1));x*=scale;y*=scale;joyX=x/lim;joyZ=y/lim;nub.style.left=(r.width/2-nub.offsetWidth/2+x)+'px';nub.style.top=(r.height/2-nub.offsetHeight/2+y)+'px'}
joy.addEventListener('pointerdown',e=>{joyPointer=e.pointerId;joy.setPointerCapture(e.pointerId);moveJoy(e)});
joy.addEventListener('pointermove',e=>{if(e.pointerId===joyPointer)moveJoy(e)});
function clearJoy(){joyPointer=null;joyX=joyZ=0;nub.style.left=(joy.clientWidth-nub.offsetWidth)/2+'px';nub.style.top=(joy.clientHeight-nub.offsetHeight)/2+'px'}
joy.addEventListener('pointerup',clearJoy);joy.addEventListener('pointercancel',clearJoy);
const kickBtn=byId('kick');kickBtn.addEventListener('pointerdown',e=>{e.preventDefault();kickBtn.setPointerCapture(e.pointerId);kickHeld=true;charge=0});
function release(){if(kickHeld){kick(Math.max(.12,charge));kickHeld=false;charge=0}}
kickBtn.addEventListener('pointerup',release);kickBtn.addEventListener('pointercancel',release);
byId('pass').addEventListener('pointerdown',()=>kick(.25,true));
byId('switch').addEventListener('pointerdown',()=>{let ps=players.filter(p=>p.team===0),i=ps.indexOf(controlled);select(ps[(i+1)%ps.length]);say('Switched player')});
byId('tackle').addEventListener('pointerdown',()=>{let target=closest(1,controlled.x,controlled.z);if(target&&ball.owner===target&&Math.hypot(target.x-controlled.x,target.z-controlled.z)<6){possess(controlled);say('Tackle! Ball won')}else say('Get closer to tackle')});
byId('camera').addEventListener('click',()=>{camMode=(camMode+1)%3;say(['Broadcast camera','Closer camera','High tactical camera'][camMode])});
byId('start').addEventListener('click',()=>{playing=!playing;byId('start').textContent=playing?'PAUSE':'START';say(playing?'Play on!':'Paused')});
window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')joyX=-1;if(e.key==='ArrowRight'||e.key==='d')joyX=1;if(e.key==='ArrowUp'||e.key==='w')joyZ=-1;if(e.key==='ArrowDown'||e.key==='s')joyZ=1;if(e.code==='Space'&&!kickHeld){kickHeld=true;charge=0}if(e.key==='j')kick(.25,true);if(e.key==='e')byId('switch').dispatchEvent(new Event('pointerdown'))});
window.addEventListener('keyup',e=>{if(['ArrowLeft','ArrowRight','a','d'].includes(e.key))joyX=0;if(['ArrowUp','ArrowDown','w','s'].includes(e.key))joyZ=0;if(e.code==='Space')release()});
function clampPitch(p){const a=99,b=58,n=2.45;let v=Math.pow(Math.abs(p.x/a),n)+Math.pow(Math.abs(p.z/b),n);if(v>1){let f=Math.pow(v,-1/n);p.x*=f;p.z*=f}}
function update(dt,time){if(!playing)return;remaining=Math.max(0,remaining-dt);if(remaining===0){playing=false;byId('start').textContent='START';say('Full time!')}
let secs=Math.ceil(remaining);byId('clock').textContent=Math.floor(secs/60)+':'+String(secs%60).padStart(2,'0');
if(kickHeld)charge=Math.min(1,charge+dt/.95);byId('fill').style.width=Math.round(charge*100)+'%';
for(let p of players){let dx=0,dz=0,spd=19;
if(p===controlled){dx=joyX;dz=joyZ;spd=24}
else if(ball.owner===p){dx=p.team===1?-1:1;dz=Math.sin(time*.6+p.number)*.25;spd=18}
else if(ball.owner){let carrier=ball.owner,attack=p.team===carrier.team;let targetX=attack?Math.min(85,p.homeX+(p.team===0?27:-27)):carrier.x+(p.team===0?13:-13);let targetZ=attack?p.homeZ*.85:carrier.z+(p.number-3)*5;dx=targetX-p.x;dz=targetZ-p.z;spd=attack?15:17;if(!attack&&p===closest(p.team,carrier.x,carrier.z))spd=23}
else{dx=ball.x-p.x;dz=ball.z-p.z;spd=17}
let len=Math.hypot(dx,dz);if(len>1){dx/=len;dz/=len}else{dx=0;dz=0}
let smoothing=Math.min(1,dt*6);p.vx+=(dx*spd-p.vx)*smoothing;p.vz+=(dz*spd-p.vz)*smoothing;p.x+=p.vx*dt;p.z+=p.vz*dt;clampPitch(p);
p.root.position.set(p.x,0,p.z);let speed=Math.hypot(p.vx,p.vz);if(speed>1){p.faceX=p.vx/speed;p.faceZ=p.vz/speed;p.root.rotation.y=Math.atan2(p.faceX,p.faceZ)}p.run+=dt*speed*.55;let swing=Math.sin(p.run)*Math.min(.65,speed/30);p.limbs[1].rotation.x=swing;p.limbs[3].rotation.x=-swing;p.limbs[0].rotation.x=-swing*.7;p.limbs[2].rotation.x=swing*.7;
}
if(ball.owner){let p=ball.owner;ball.x=p.x+p.faceX*1.2;ball.z=p.z+p.faceZ*1.2;ball.y=3.35;if(p.team===1&&Math.random()<dt*.3) {let old=controlled;controlled=p;kick(.4+Math.random()*.4);controlled=old}}
else if(ball.flight){ball.x+=ball.vx*dt;ball.z+=ball.vz*dt;ball.y+=ball.vy*dt;ball.vy-=36*dt;ball.vx*=Math.max(0,1-dt*.12);ball.vz*=Math.max(0,1-dt*.12);
if(ball.y<1){ball.y=1;if(Math.abs(ball.vy)>5){ball.vy=Math.abs(ball.vy)*.27;ball.vx*=.64;ball.vz*=.64}else{ball.vy=0;ball.vx*=Math.max(0,1-dt*3);ball.vz*=Math.max(0,1-dt*3)}}
for(let p of players)if(Math.hypot(ball.x-p.x,ball.z-p.z)<2.6&&ball.y<6.8){possess(p);say(p.team===0?'Mark / possession!':'Opposition possession');break}
if(Math.abs(ball.x)>99&&Math.abs(ball.z)<13){score(ball.vx>0?0:1,Math.abs(ball.z)<6?6:1)}
}
ballObj.position.set(ball.x,ball.y,ball.z);ballObj.rotation.z+=dt*12;ballObj.rotation.x+=dt*4;
}
let camTarget=new T.Vector3(),lookTarget=new T.Vector3();const clock=new T.Clock();let elapsed=0;
function render(){requestAnimationFrame(render);let dt=Math.min(clock.getDelta(),.05);elapsed+=dt;update(dt,elapsed);
const follow=ball.owner||controlled,focusX=follow.x*.65+ball.x*.35,focusZ=follow.z*.65+ball.z*.35;
const air=ball.flight?Math.min(18,Math.max(0,ball.y)*.6):0;
let offX=camMode===2?-12:camMode===1?-25:-37,offY=camMode===2?95:camMode===1?37:53,offZ=camMode===2?12:camMode===1?46:72;
camTarget.set(focusX+offX,offY+air,focusZ+offZ+air*.6);camera.position.lerp(camTarget,Math.min(1,dt*2.6));
lookTarget.set(focusX+7,2,focusZ);camera.lookAt(lookTarget);
renderer.render(scene,camera);if(noticeTimer>0){noticeTimer-=dt;if(noticeTimer<=0)hint.textContent='Move • Hold KICK • PASS • TACKLE • SWITCH'}
}
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}
addEventListener('resize',resize);loading.remove();say('V12: Real 3D ground, players and camera');render();
})();
</script></body></html>
