<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Oval Arcade — iPhone Edition</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101a24;color:#f5f7fa;font:15px system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:5px;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
h1{font-size:22px;margin:4px 0}p{margin:6px 0 10px;color:#c8d4df;text-align:center}
#hud{display:flex;gap:24px;align-items:center;justify-content:center;font-weight:700;margin:8px 0}
canvas{display:block;width:min(98vw,1000px);height:auto;aspect-ratio: 1000/600;border:3px solid #d9e4e9;border-radius:10px;touch-action:none}
button{background:#f8c846;border:0;border-radius:8px;padding:12px 18px;font-weight:800;cursor:pointer}
.controls{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin:10px auto}
.touch{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:8px}
.touch{width:min(98vw,1000px);justify-content:space-between;padding:0 15px}
.touch button{min-width:64px;touch-action:none;user-select:none}
#joystick{position:relative;width:118px;height:118px;border:3px solid #91a9bb;background:#ffffff20;border-radius:50%;touch-action:none;flex-shrink:0}
#stick{position:absolute;width:53px;height:53px;border-radius:50%;background:#f8c846;left:30px;top:30px;pointer-events:none}
.actions{display:grid;grid-template-columns:repeat(2,80px);gap:8px}
.actions button{min-height:51px}
@media(orientation:landscape) and (max-height:550px){h1,p,small{display:none}#hud{margin:2px 0}canvas{width:auto;height:min(61vh,600px);max-width:98vw}.touch{margin:2px auto}#joystick{width:90px;height:90px}#stick{left:20px;top:20px;width:44px;height:44px}.actions button{min-height:39px;padding:6px} .controls{margin:2px auto}.controls button{padding:7px 15px}}

#msg{min-height:24px;color:#ffdd78;font-weight:700}
small{color:#bac8d6;text-align:center}
</style></head><body>
<h1>🏉 OVAL ARCADE — MOBILE</h1>
<p>Blue vs Red • iPhone edition • landscape recommended</p>
<div id="hud"><span id="blue">BLUE 0.0 (0)</span><span id="clock">02:00</span><span id="red">RED 0.0 (0)</span></div>
<canvas id="game" width="1000" height="600"></canvas>
<div id="msg">Press Start to play</div>
<div class="controls"><button id="start">Start / Restart</button><button id="pause">Pause</button></div>
<small>Drag the joystick to move. Tap Kick, Pass, Tackle or Switch. Turn your phone sideways for a larger field.</small>
<div class="touch" id="mobileControls">
<div id="joystick"><div id="stick"></div></div>
<div class="actions"><button data-key="space">KICK</button><button data-key="j">PASS</button><button data-key="k">TACKLE</button><button data-key="e">SWITCH</button></div>
</div>
<script>
(()=>{
const c=document.getElementById('game'),g=c.getContext('2d'),keys=new Set();
let joyX=0,joyY=0;
const $=id=>document.getElementById(id);
let players=[],ball,controlled=0,score=[{g:0,b:0},{g:0,b:0}],time=120,running=false,paused=false,last=0,message='',messageTimer=0,lock=0;
const cx=500,cy=300,rx=455,ry=270,goaly=[253,347],behind=[209,391];
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
function inside(x,y){return ((x-cx)/rx)**2+((y-cy)/ry)**2<=1}
function spawn(){
players=[];
for(let t=0;t<2;t++)for(let i=0;i<5;i++){
let x=t===0?260+(i%3)*95:740-(i%3)*95,y=180+Math.floor(i/3)*230+(i%3)*40;
players.push({x,y,t,i,vx:0,vy:0,stun:0});
}
controlled=0;ball={x:500,y:300,vx:0,vy:0,owner:null,air:0,grace:0};
}
function setMsg(s,d=1.8){message=s;messageTimer=d;$('msg').textContent=s}
function reset(){score=[{g:0,b:0},{g:0,b:0}];time=120;spawn();running=true;paused=false;lock=0;setMsg('Collect the ball and attack right!')}
function centre(){spawn();lock=.7}
function give(p){ball.owner=p;ball.air=0;ball.vx=0;ball.vy=0;ball.grace=.25}
function nearest(t,x,y,exclude){let best=null,d=1e9;for(const p of players)if(p.t===t&&p!==exclude){let q=Math.hypot(p.x-x,p.y-y);if(q<d){best=p;d=q}}return best}
function action(type){
if(!running||paused||lock>0)return;
const p=players[controlled];if(type==='e'){const n=nearest(0,ball.x,ball.y,p);if(n)controlled=players.indexOf(n);return}
if(type==='k'&&ball.owner&&ball.owner.t!==0){if(dist(p,ball.owner)<36){ball.owner.stun=.65;give(p);setMsg('Tackle! Ball won!')}return}
if(ball.owner!==p)return;
if(type==='space'||type==='j'){
let tx,ty,speed;
if(type==='j'){const mate=nearest(0,p.x+95,p.y,p);tx=mate?mate.x+mate.vx*.3:p.x+120;ty=mate?mate.y+mate.vy*.3:p.y;speed=350}
else{tx=1040;ty=300;speed=620}
let a=Math.atan2(ty-p.y,tx-p.x);
ball.owner=null;ball.x=p.x+Math.cos(a)*21;ball.y=p.y+Math.sin(a)*21;
ball.vx=Math.cos(a)*speed;ball.vy=Math.sin(a)*speed;ball.air=type==='space'?.65:.22;ball.grace=.24;
setMsg(type==='space'?'Kick!':'Handball!');
}
}
function scoreGoal(team,points){score[team][points===6?'g':'b']++;setMsg(team===0?(points===6?'GOAL! SIX POINTS!':'Behind! One point.'):(points===6?'Red goal!':'Red behind.'),2.5);centre()}
function update(dt){
if(!running||paused)return;
time=Math.max(0,time-dt);if(time===0){running=false;setMsg((score[0].g*6+score[0].b>score[1].g*6+score[1].b)?'FULL TIME — BLUE WINS!':(score[0].g*6+score[0].b<score[1].g*6+score[1].b)?'FULL TIME — RED WINS!':'FULL TIME — DRAW!');return}
lock=Math.max(0,lock-dt);messageTimer-=dt;if(messageTimer<=0&&message){message='';$('msg').textContent=''}
ball.grace=Math.max(0,ball.grace-dt);
for(let index=0;index<players.length;index++){
const p=players[index];p.stun=Math.max(0,p.stun-dt);if(p.stun>0)continue;
let dx=0,dy=0;
if(index===controlled){
dx=joyX+Number(keys.has('d')||keys.has('arrowright'))-Number(keys.has('a')||keys.has('arrowleft'));
dy=joyY+Number(keys.has('s')||keys.has('arrowdown'))-Number(keys.has('w')||keys.has('arrowup'));
}else{
let target;
if(ball.owner===p){target={x:p.t===0?950:50,y:300}}
else if(ball.owner&&ball.owner.t===p.t){target={x:clamp(ball.owner.x+(p.i%2?100:-70)*(p.t===0?1:-1),90,910),y:clamp(ball.owner.y+(p.i%3-1)*100,80,520)}}
else if(ball.owner&&ball.owner.t!==p.t){target={x:ball.owner.x+(p.i%3-1)*35,y:ball.owner.y+(p.i%2?30:-30)}}
else target={x:ball.x+(p.i%3-1)*22,y:ball.y+(p.i%2?18:-18)};
const dd=dist(p,target);if(dd>17){dx=(target.x-p.x)/dd;dy=(target.y-p.y)/dd}
}
let norm=Math.hypot(dx,dy)||1,speed=index===controlled?235: p.t===1?170:155;
p.vx=dx/norm*speed;p.vy=dy/norm*speed;
let nx=p.x+p.vx*dt,ny=p.y+p.vy*dt;
if(inside(nx,ny)){p.x=nx;p.y=ny}
}
if(ball.owner){
let p=ball.owner;ball.x=p.x+(p.t===0?17:-17);ball.y=p.y;
if(p.t===1&&p.x<340&&Math.random()<dt*1.2){let a=Math.atan2(300-p.y,-1);ball.owner=null;ball.vx=-590;ball.vy=(300-p.y)*1.3;ball.air=.6;ball.grace=.25}
for(const opponent of players)if(opponent.t!==p.t&&dist(opponent,p)<23&&ball.grace<=0){p.stun=.5;give(opponent);if(opponent.t===0)controlled=players.indexOf(opponent);break}
}else{
ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;
ball.vx*=Math.pow(.985,dt*60);ball.vy*=Math.pow(.985,dt*60);
ball.air=Math.max(0,ball.air-dt);
if(ball.x>=957||ball.x<=43){
let team=ball.x>=957?0:1;
if(ball.y>=goaly[0]&&ball.y<=goaly[1]){scoreGoal(team,6);return}
if(ball.y>=behind[0]&&ball.y<=behind[1]){scoreGoal(team,1);return}
}
if(!inside(ball.x,ball.y)){setMsg('Out of bounds — throw in!');centre();return}
if(ball.grace<=0)for(const p of players)if(dist(p,ball)<21){give(p);if(p.t===0)controlled=players.indexOf(p);break}
}
$('clock').textContent=`${String(Math.floor(time/60)).padStart(2,'0')}:${String(Math.floor(time%60)).padStart(2,'0')}`;
for(let t=0;t<2;t++){const s=score[t];$(t?'red':'blue').textContent=`${t?'RED':'BLUE'} ${s.g}.${s.b} (${s.g*6+s.b})`}
}
function draw(){
g.fillStyle='#193644';g.fillRect(0,0,1000,600);
g.fillStyle='#317d49';g.beginPath();g.ellipse(cx,cy,rx,ry,0,0,Math.PI*2);g.fill();
g.strokeStyle='#e6f2e3';g.lineWidth=3;g.stroke();
g.beginPath();g.moveTo(500,30);g.lineTo(500,570);g.stroke();
g.beginPath();g.arc(500,300,55,0,Math.PI*2);g.stroke();
for(let x of [145,855]){g.beginPath();g.arc(x,300,100,-Math.PI/2,Math.PI/2,x===145);g.stroke()}
for(let x of [43,957]){g.lineWidth=5;for(let y of behind){g.strokeStyle='#ddd';g.beginPath();g.moveTo(x,y-4);g.lineTo(x,y+4);g.stroke()}for(let y of goaly){g.strokeStyle='#f8c846';g.beginPath();g.moveTo(x,y-9);g.lineTo(x,y+9);g.stroke()}}
for(let i=0;i<players.length;i++){
let p=players[i];if(i===controlled){g.strokeStyle='#ffe565';g.lineWidth=4;g.beginPath();g.arc(p.x,p.y,23,0,Math.PI*2);g.stroke()}
g.fillStyle=p.t===0?'#2a91ff':'#f15154';g.beginPath();g.arc(p.x,p.y,15,0,Math.PI*2);g.fill();
g.strokeStyle='#fff';g.lineWidth=2;g.stroke();
g.fillStyle='#fff';g.font='bold 13px system-ui';g.textAlign='center';g.textBaseline='middle';g.fillText(p.i+1,p.x,p.y);
}
g.fillStyle='#f4b34d';g.beginPath();g.ellipse(ball.x,ball.y,11,7,Math.atan2(ball.vy,ball.vx),0,Math.PI*2);g.fill();g.strokeStyle='#45220d';g.lineWidth=1.5;g.stroke();
if(!running){g.fillStyle='#07121bd0';g.fillRect(260,220,480,155);g.textAlign='center';g.fillStyle='white';g.font='bold 30px system-ui';g.fillText(time===0?'FULL TIME':'OVAL ARCADE',500,278);g.font='18px system-ui';g.fillText('Press Start / Restart to play',500,325)}
if(paused){g.fillStyle='#061522bb';g.fillRect(0,0,1000,600);g.fillStyle='#fff';g.font='bold 36px system-ui';g.textAlign='center';g.fillText('PAUSED',500,300)}
}
function loop(now){let dt=Math.min((now-last)/1000||0,.035);last=now;update(dt);draw();requestAnimationFrame(loop)}
$('start').onclick=reset;$('pause').onclick=()=>{if(running){paused=!paused;setMsg(paused?'Paused':'Game on!')}};
document.addEventListener('keydown',e=>{let k=e.key.toLowerCase();if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault();k=k===' '?'space':k;if(!keys.has(k)&&['space','j','k','e'].includes(k))action(k);keys.add(k)});
document.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()===' '?'space':e.key.toLowerCase()));
document.querySelectorAll('[data-key]').forEach(b=>{let k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);if(['space','j','k','e'].includes(k))action(k);keys.add(k)});for(let ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>keys.delete(k))});
const joy=document.getElementById('joystick'),stick=document.getElementById('stick');
function moveJoy(e){
 const r=joy.getBoundingClientRect(),midX=r.left+r.width/2,midY=r.top+r.height/2;
 let x=e.clientX-midX,y=e.clientY-midY,limit=(r.width-55)/2;
 const d=Math.hypot(x,y);if(d>limit){x*=limit/d;y*=limit/d}
 joyX=x/limit;joyY=y/limit;
 stick.style.left=((r.width-53)/2+x)+'px';stick.style.top=((r.height-53)/2+y)+'px';
}
function stopJoy(){joyX=0;joyY=0;stick.style.left=(joy.clientWidth-53)/2+'px';stick.style.top=(joy.clientHeight-53)/2+'px'}
joy.addEventListener('pointerdown',e=>{e.preventDefault();joy.setPointerCapture(e.pointerId);moveJoy(e)});
joy.addEventListener('pointermove',e=>{if(joy.hasPointerCapture(e.pointerId))moveJoy(e)});
['pointerup','pointercancel','lostpointercapture'].forEach(t=>joy.addEventListener(t,stopJoy));
stopJoy();
spawn();requestAnimationFrame(loop);
})();
</script></body></html>
