function makePlayer(team,x,z,number){let root=new T.Group();scene.add(root);root.position.set(x,0,z);

const ballObj=mesh(new T.SphereGeometry(.75,16,10),mat(0xb62c2c,.5));ballObj.scale.set(1.5,.72,.8);ballObj.castShadow=true;
const ball={owner:players[0],x:players[0].x,z:players[0].z,y:3,vx:0,vz:0,vy:0,flight:false,releaseBy:null,releaseTimer:0,flightAge:0};
let controlled=players[0],playing=false,remaining=120,blue=0,red=0,joyX=0,joyZ=0,kickHeld=false,charge=0,camMode=0,noticeTimer=0;
let restart=null,setShot=null,shotClock=0,aimX=1,aimZ=0;
let ruck=null,aiDecision=0, possessionChange=0;

 for(let p of players){p.x=p.homeX*.65;p.z=p.homeZ*.8;p.vx=p.vz=0;p.root.position.set(p.x,0,p.z)}
 const blueRuck=players[3],redRuck=players[10];
 blueRuck.x=-3;blueRuck.z=0;redRuck.x=3;redRuck.z=0;

}
function updateRuck(dt){
 if(!ruck)return false;

 if(ruck.phase==='rise'){
   const progress=1-Math.max(0,ruck.timer)/1.15;
   ball.y=2.3+12*Math.sin(progress*Math.PI*.8);
   if(ruck.timer<=0){ruck.phase='tap';ruck.timer=.4;ball.y=12}
 }else if(ruck.phase==='tap'){
   ball.y=12-(.4-ruck.timer)*8;
   if(ruck.timer<=0){
     const dirMag=Math.hypot(joyX,joyZ);

function targetTeammate(p,dirX,dirZ,limit=70){

const aimArrow=new T.Group();scene.add(aimArrow);const arrowMat=new T.MeshBasicMaterial({color:0xffe45b,transparent:true,opacity:.86,depthTest:false});let shaft=mesh(new T.BoxGeometry(.65,.10,7),arrowMat,aimArrow);shaft.position.z=3.5;let tip=mesh(new T.ConeGeometry(1.5,3.3,3),arrowMat,aimArrow);tip.rotation.x=Math.PI/2;tip.position.z=8;aimArrow.visible=false;

joy.addEventListener('pointerup',e=>{if(Date.now()-lastTouch>800)clearJoy()});
function bindPress(id,fn){const el=byId(id);let touched=0;el.addEventListener('touchstart',e=>{e.preventDefault();touched=Date.now();fn('down')},{passive:false});el.addEventListener('touchend',e=>{e.preventDefault();fn('up')},{passive:false});el.addEventListener('touchcancel',e=>fn('up'),{passive:false});el.addEventListener('pointerdown',e=>{if(Date.now()-touched>800)fn('down')});el.addEventListener('pointerup',e=>{if(Date.now()-touched>800)fn('up')});el.addEventListener('click',e=>{if(Date.now()-touched>800&&e.detail===0)fn('down')})}
function release(){if(kickHeld){debugInput('KICK released '+Math.round(charge*100)+'%');kick(Math.max(.12,charge));kickHeld=false;charge=0;byId('fill').style.width='0%'}}
bindPress('kick',phase=>{if(phase==='down'){kickHeld=true;charge=0;debugInput('KICK charging');say('Charging kick…')}else release()});
bindPress('pass',phase=>{if(phase==='down'){debugInput('PASS pressed');kick(.25,true)}});
bindPress('switch',phase=>{if(phase==='down'){if(ball.owner&&ball.owner.team===0){select(ball.owner);say('Ball carrier locked');return}let ps=players.filter(p=>p.team===0),i=ps.indexOf(controlled);select(ps[(i+1)%ps.length]);debugInput('SWITCH blue '+(controlled.number+1));say('Switched to BLUE #'+(controlled.number+1))}});
bindPress('tackle',phase=>{if(phase==='down'){debugInput('TACKLE pressed');let target=closest(1,controlled.x,controlled.z);if(target&&ball.owner===target&&Math.hypot(target.x-controlled.x,target.z-controlled.z)<6){possess(controlled);say('Tackle! Ball won')}else {let t=closest(1,controlled.x,controlled.z);if(t){let dx=t.x-controlled.x,dz=t.z-controlled.z,d=Math.hypot(dx,dz)||1;controlled.x+=dx/d*4;controlled.z+=dz/d*4;controlled.root.position.set(controlled.x,0,controlled.z)}say('Tackle attempt! Move closer to ball carrier')}}});
bindPress('camera',phase=>{if(phase==='down'){camMode=(camMode+1)%3;debugInput('CAMERA '+camMode);say(['Broadcast camera','Closer camera','High tactical camera'][camMode])}});
// START uses one native click only: avoid double-toggle from iOS touch + pointer events.
const startButton=byId('start');
function toggleStart(){
 if(remaining<=0){remaining=120;blue=red=0;byId('blueScore').textContent='0';byId('redScore').textContent='0';resetPositions()}
 playing=!playing;
 if(playing&&!ruck&&remaining===120)startBallUp();
 startButton.textContent=playing?'PAUSE':'START';
 debugInput(playing?'MATCH STARTED':'MATCH PAUSED');
 say(playing?'Play on!':'Paused');
}
// Handle one touch once; suppress Safari's synthetic click to prevent start/pause toggling.
let startTouchAt=0;
startButton.addEventListener('touchstart',e=>{e.preventDefault();startTouchAt=Date.now();toggleStart()},{passive:false});
startButton.addEventListener('click',e=>{e.preventDefault();if(Date.now()-startTouchAt>900)toggleStart()});
window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')joyX=-1;if(e.key==='ArrowRight'||e.key==='d')joyX=1;if(e.key==='ArrowUp'||e.key==='w')joyZ=-1;if(e.key==='ArrowDown'||e.key==='s')joyZ=1;if(e.code==='Space'&&!kickHeld){kickHeld=true;charge=0}if(e.key==='j')kick(.25,true);if(e.key==='e')byId('switch').dispatchEvent(new Event('pointerdown'))});
window.addEventListener('keyup',e=>{if(['ArrowLeft','ArrowRight','a','d'].includes(e.key))joyX=0;if(['ArrowUp','ArrowDown','w','s'].includes(e.key))joyZ=0;if(e.code==='Space')release()});
function clampPitch(p){const a=99,b=58,n=2.45;let v=Math.pow(Math.abs(p.x/a),n)+Math.pow(Math.abs(p.z/b),n);if(v>1){let f=Math.pow(v,-1/n);p.x*=f;p.z*=f}}
function update(dt,time){
 aimArrow.visible=playing&&!!ball.owner&&ball.owner===controlled&&controlled.team===0&&(kickHeld||!!setShot);
 if(aimArrow.visible){let ax=setShot===controlled?aimX:Math.hypot(joyX,joyZ)>.22?joyX:controlled.faceX,az=setShot===controlled?aimZ:Math.hypot(joyX,joyZ)>.22?joyZ:controlled.faceZ;const l=Math.hypot(ax,az)||1;ax/=l;az/=l;aimArrow.position.set(controlled.x+ax*2,.3,controlled.z+az*2);aimArrow.rotation.y=Math.atan2(ax,az)}
 if(kickHeld){charge=Math.min(1,charge+dt/.95);byId('fill').style.width=Math.round(charge*100)+'%';debugInput('KICK POWER '+Math.round(charge*100)+'%')}if(!playing)return;
 if(restart){restart.timer-=dt;if(restart.timer<=0)restartPlay();return}
 if(updateRuck(dt))return;
 if(setShot){shotClock-=dt;if(Math.hypot(joyX,joyZ)>.2){aimX=joyX;aimZ=joyZ;let m=Math.hypot(aimX,aimZ);aimX/=m;aimZ/=m}if(shotClock<=0){setShot=null;say('PLAY ON — shot clock expired')}}
 remaining=Math.max(0,remaining-dt);if(remaining===0){playing=false;byId('start').textContent='RESTART';say('Full time!')}
let secs=Math.ceil(remaining);byId('clock').textContent=Math.floor(secs/60)+':'+String(secs%60).padStart(2,'0');
for(let p of players){let dx=0,dz=0,spd=15;
if(p===controlled){dx=setShot?0:joyX;dz=setShot?0:joyZ;spd=26}
else if(ball.owner===p){dx=setShot===p?0:forward(p.team);dz=setShot===p?0:Math.sin(time*.6+p.number)*.25;spd=17}
else {
// Formation-based AI: each player has an individual home lane. Only one defender presses.
let carrier=ball.owner,attacking=carrier&&carrier.team===p.team;
let side=forward(p.team);
let targetX=p.homeX,targetZ=p.homeZ;
if(carrier){
  if(attacking){
    // The whole team transitions forward, with staggered running lanes.
    const ahead=10+(p.number%3)*9;
    targetX=Math.max(-82,Math.min(82,carrier.x+side*ahead));
    const lane=(p.number-3)*10;
    targetZ=Math.max(-46,Math.min(46,carrier.z*.35+lane));
    if(Math.hypot(targetX-p.x,targetZ-p.z)>15)spd=19;
  }else{
    // Closest defender presses; others protect the corridor and match runners.
    targetX=p.homeX*.45+carrier.x*.55-side*(7+(p.number%3)*5);
    targetZ=p.homeZ*.35+carrier.z*.65;
    if(p===closest(p.team,carrier.x,carrier.z)){
      targetX=carrier.x-side*1.6;targetZ=carrier.z;spd=22;
      if(Math.hypot(p.x-carrier.x,p.z-carrier.z)<3.1&&Math.random()<dt*.7){
        const opponent=carrier;possess(p);say(p.team===0?'Turnover! Blue wins the ball':'Turnover! Red wins the ball');
      }
    }
  }
}else if(ball.flight){
  if(p===closest(p.team,ball.x+ball.vx*.23,ball.z+ball.vz*.23)){
    targetX=ball.x+ball.vx*.23;targetZ=ball.z+ball.vz*.23;spd=23;
  }else{
    targetX=p.homeX*.6+ball.x*.4;targetZ=p.homeZ*.6+ball.z*.4;
  }
}

dx=targetX-p.x;dz=targetZ-p.z;spd=Math.min(spd,Math.max(0,Math.hypot(dx,dz)*2.5));
}
let len=Math.hypot(dx,dz);if(p===controlled){if(len>.01){dx/=Math.max(1,len);dz/=Math.max(1,len)}else{dx=0;dz=0}}else if(len>1){dx/=len;dz/=len}else{dx=0;dz=0}
let smoothing=p===controlled?1:Math.min(1,dt*6);p.vx+=(dx*spd-p.vx)*smoothing;p.vz+=(dz*spd-p.vz)*smoothing;p.x+=p.vx*dt;p.z+=p.vz*dt;clampPitch(p);
p.root.position.set(p.x,0,p.z);let speed=Math.hypot(p.vx,p.vz);if(speed>1){p.faceX=p.vx/speed;p.faceZ=p.vz/speed;p.root.rotation.y=Math.atan2(p.faceX,p.faceZ)}p.run+=dt*speed*.55;let swing=Math.sin(p.run)*Math.min(.65,speed/30);p.limbs[1].rotation.x=swing;p.limbs[3].rotation.x=-swing;p.limbs[0].rotation.x=-swing*.7;p.limbs[2].rotation.x=swing*.7;
}
if(ball.owner){let p=ball.owner;ball.x=p.x+p.faceX*1.2;ball.z=p.z+p.faceZ*1.2;ball.y=3.35;
 if(p.team===1)aiWithBall(p,dt);
}
else if(ball.flight){ball.flightAge+=dt;ball.releaseTimer=Math.max(0,ball.releaseTimer-dt);ball.x+=ball.vx*dt;ball.z+=ball.vz*dt;ball.y+=ball.vy*dt;ball.vy-=36*dt;ball.vx*=Math.max(0,1-dt*.12);ball.vz*=Math.max(0,1-dt*.12);
if(ball.kind==='handball'&&ball.target&&ball.flightAge>.17&&ball.flightAge<1.2){
 const target=ball.target;const dist=Math.hypot(ball.x-target.x,ball.z-target.z);
 if(dist<4.5&&ball.y<7&&(target!==ball.releaseBy)){possess(target);say(target.team===0?'Handball received!':'Opposition receives handball!')}
}
if(ball.flight&&ball.y<1){ball.bounces=(ball.bounces||0)+1;ball.y=1;if(Math.abs(ball.vy)>5){ball.vy=Math.abs(ball.vy)*.27;ball.vx*=.64;ball.vz*=.64}else{ball.vy=0;ball.vx*=Math.max(0,1-dt*3);ball.vz*=Math.max(0,1-dt*3)}}
if(ball.flight&&outOfBounds(ball.x,ball.z)&&!(Math.abs(ball.x)>99&&Math.abs(ball.z)<13)){boundaryRestart()}else if(ball.flight)for(let p of players)if((p!==ball.releaseBy||ball.releaseTimer<=0)&&ball.flightAge>.18&&Math.hypot(ball.x-p.x,ball.z-p.z)<2.7&&ball.y<5.8){if(ball.kind==='kick'&&ball.bounces===0&&ball.flightAge>.35){awardMark(p)}else{possess(p);say(p.team===0?'Blue possession':'Opposition possession')}break}
if(ball.flight&&Math.abs(ball.x)>99&&Math.abs(ball.z)<13){score(ball.vx>0?0:1,Math.abs(ball.z)<6?6:1)}
}
ballObj.position.set(ball.x,ball.y,ball.z);ballObj.rotation.z+=dt*12;ballObj.rotation.x+=dt*4;
}
let camTarget=new T.Vector3(),lookTarget=new T.Vector3();const clock=new T.Clock();let elapsed=0;
function render(){requestAnimationFrame(render);let dt=Math.min(clock.getDelta(),.05);elapsed+=dt;update(dt,elapsed);byId('position').textContent='PLAYER #'+(controlled.number+1)+' X:'+controlled.x.toFixed(1)+' Z:'+controlled.z.toFixed(1)+' '+(playing?'PLAY':'PAUSE')+' JOY:'+joyX.toFixed(1)+','+joyZ.toFixed(1)+' BALL:'+(ball.owner?ball.owner.team===0?'BLUE':'RED':'AIR '+ball.flightAge.toFixed(1)+'s');
const follow=controlled,focusX=follow.x*.9+ball.x*.1,focusZ=follow.z*.9+ball.z*.1;
const air=ball.flight?Math.min(18,Math.max(0,ball.y)*.6):0;
let offX=setShot?(setShot.team===0?-20:20):camMode===2?-12:camMode===1?-25:-37,offY=setShot?19:camMode===2?95:camMode===1?37:53,offZ=setShot?4:camMode===2?12:camMode===1?46:72;
camTarget.set(focusX+offX,offY+air,focusZ+offZ+air*.6);camera.position.lerp(camTarget,Math.min(1,dt*2.6));
lookTarget.set(setShot?(setShot.team===0?100:-100):focusX+7,2,setShot?0:focusZ);camera.lookAt(lookTarget);
renderer.render(scene,camera);if(noticeTimer>0){noticeTimer-=dt;if(noticeTimer<=0)hint.textContent='Move • Hold KICK • PASS • TACKLE • SWITCH'}
}
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}
addEventListener('resize',resize);
renderer.domElement.addEventListener('pointerdown',e=>{if(!playing)return;let r=renderer.domElement.getBoundingClientRect();let x=e.clientX-r.left,y=e.clientY-r.top; if(x<r.width*.55){joyX=x<r.width*.28?-.7:.7;joyZ=y<r.height*.5?-.7:.7;debugInput('SCREEN movement')}},{passive:true});
renderer.domElement.addEventListener('pointerup',()=>{joyX=joyZ=0});
document.addEventListener('touchmove',e=>{if(e.target.closest('#joy,#actions,#menu'))e.preventDefault()},{passive:false});loading.remove();say('V20: Ruck taps, team tactics and smarter passing');render();
})();
</script></body></html>
